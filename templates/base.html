<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Document{% endblock %}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'styles.css' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'SudoTeam.ico' %}">
    <link rel="stylesheet" href="{% static 'pagination.css' %}">
    <link rel="stylesheet" href="{% static 'contacts_app/add_contact.css' %}">
    <link rel="stylesheet" href="{% static 'contacts_app/contacts_list.css' %}">
    <link rel="stylesheet" href="{% static 'files_app/files_app.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Moderustic:wght@300..800&display=swap" rel="stylesheet">

    <style>
        @media (max-width: 767px) {
            .navbar {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }

            .navbar-brand {
                font-size: 1.5rem;
            }

            .navbar-nav {
                display: none;
            }

            .navbar-text {
                display: flex;
                justify-content: flex-end;
                width: 100%;
            }

            .btn {
                margin-left: 10px;
                background-color: #E2B29B;
                color: #155840;
                border: none;
                padding: 12px 15px;
                font-size: 1rem;
            }

            .btn:hover {
                background-color: #C69C6D;
            }

            .currency-section {
                margin-top: 20px;
                padding: 10px;
                background-color: #155840;
                color: #E2B29B;
                text-align: center;
            }

            .currency-section .currency-item {
                display: inline-block;
                margin-right: 10px;
            }
        }

        @media (min-width: 768px) {
            .navbar {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }

            .navbar-nav {
                display: flex;
                justify-content: flex-end;
            }

            .navbar-nav .nav-item {
                margin-left: 15px;
            }

            .navbar-text {
                display: flex;
                align-items: center;
            }

            .btn {
                width: auto;
                margin-left: 10px;
            }
        }

    </style>
</head>
<body style="background-color: #3D6657; color: #E2B29B;">
    <nav class="navbar navbar-expand-lg" style="background-color: #155840; color: #E2B29B;">
        <a class="navbar-brand" href="{% url 'home' %}" style="color: #81BDA8;">PA</a>
        <div class="navbar-text ml-auto">
            {% if user.is_authenticated %}
                Hi, <a href="{% url 'users:profile' %}" style="color: #81BDA8;">{{ user.username }}</a>!
                <a href="{% url 'users:logout' %}" class="btn btn-danger" style="background-color: #CA825F; border: none;">Log out</a>
            {% else %}
                <a href="{% url 'users:login' %}" class="btn btn-primary" style="background-color: #E2B29B; color: #155840; border: none;">Login</a>
                <a href="{% url 'users:signup' %}" class="btn btn-primary" style="background-color: #E2B29B; color: #155840; border: none; margin-left: 10px;">Sign up</a>
            {% endif %}
        </div>
    </nav>
    
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
